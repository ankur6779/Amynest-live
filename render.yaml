# Render Blueprint — PRODUCTION ONLY
# https://render.com/docs/blueprint-spec
#
# DEV/staging is NOT defined here. Blueprint sync will NOT create or manage
# amynest-dev, amynest-frontend-dev, or amynest-db-dev. Use local dev
# (see docs/dev-environment.md) or duplicate prod services manually in the
# Render Dashboard if you need a hosted preview.
#
# IMPORTANT:
# Instance plans (RAM/CPU/storage) must be managed via Render Dashboard.
# Do NOT define `plan` in render.yaml — Blueprint sync would overwrite
# manual upgrades (e.g. larger Postgres tier, standard web, 2GB worker)
# back to the values in this file on every deploy.
#
# DO NOT DEFINE PLAN IN BLUEPRINT — leave plan undefined so the dashboard
# controls plans for Postgres (amynest-db), web, worker, and keyvalue services.
#
# IMPORTANT:
# Do NOT store secrets or production values here.
# All sensitive env must be set in Render Dashboard only.
# Use `sync: false` on each key so Blueprint registers the name once and
# NEVER overwrites dashboard values on deploy.
#
# Production:
#   Amynest-backend     → https://amynest-backend-dykj.onrender.com
#   Amynest-live-1      → static web (amynest.in)
#   amynest-ai-worker   → BullMQ worker
#   amynest-redis       → Redis (BullMQ)
#   amynest-db          → Postgres
#
# Health / env checks:
#   GET /api/healthz/env
#   GET /api/healthz/audio   — audio stack (static GCS + OpenAI TTS + fallbacks)

databases:
  - name: amynest-db
    databaseName: amynest_db
    # DO NOT DEFINE PLAN IN BLUEPRINT — dashboard controls Postgres tier (e.g. basic-256mb → basic-1gb)
    region: singapore

services:
  # ─── Redis (BullMQ AI queue) ───────────────────────────────────────────────
  - type: keyvalue
    name: amynest-redis
    # DO NOT DEFINE PLAN IN BLUEPRINT — dashboard controls RAM/CPU
    region: singapore
    ipAllowList: []

  # ─── Production API (Docker — deps layer cached until lockfile changes) ─────
  - type: web
    name: Amynest-backend
    runtime: docker
    region: singapore
    # DO NOT DEFINE PLAN IN BLUEPRINT — dashboard controls RAM/CPU
    repo: https://github.com/ankur6779/Amynest-live
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./docker/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: AMYNEST_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: PHONICS_SESSION_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: REVENUECAT_SECRET_KEY
        sync: false
      - key: REVENUECAT_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: GCS_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GCS_SERVICE_ACCOUNT_JSON_B64
        sync: false
      - key: DEFAULT_OBJECT_STORAGE_BUCKET_ID
        sync: false
      - key: GCS_BUCKET_NAME
        sync: false
      - key: GCS_PROJECT_ID
        sync: false
      - key: TTS_USE_GCS
        sync: false
      - key: TTS_ELEVENLABS_FALLBACK_ENABLED
        sync: false
      - key: OPENAI_TTS_VOICE
        sync: false
      - key: OPENAI_TTS_ACCENT
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: WORKER_ENABLED
        sync: false
      - key: BACKGROUND_TASKS_ENABLED
        sync: false
      - key: PHONICS_SEED_ENABLED
        sync: false
      - key: NOTIFICATIONS_ENABLED
        sync: false
      - key: EMAIL_FROM
        sync: false

  # ─── Production AI worker (Docker — separate image from API / frontend) ──────
  - type: worker
    name: amynest-ai-worker
    runtime: docker
    region: singapore
    # DO NOT DEFINE PLAN IN BLUEPRINT — dashboard controls RAM/CPU
    repo: https://github.com/ankur6779/Amynest-live
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./docker/worker/Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: AMYNEST_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: PHONICS_SESSION_SECRET
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: GCS_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GCS_SERVICE_ACCOUNT_JSON_B64
        sync: false
      - key: DEFAULT_OBJECT_STORAGE_BUCKET_ID
        sync: false
      - key: GCS_BUCKET_NAME
        sync: false
      - key: GCS_PROJECT_ID
        sync: false
      - key: TTS_USE_GCS
        sync: false
      - key: TTS_ELEVENLABS_FALLBACK_ENABLED
        sync: false
      - key: OPENAI_TTS_VOICE
        sync: false
      - key: WORKER_ENABLED
        sync: false

  # ─── Production static web (amynest.in) ─────────────────────────────────────
  # Audio/API: deploy infra/cloudflare/amynest-api-proxy/ so /api/* on www.amynest.in
  # proxies to Amynest-backend. The web app uses same-origin API on amynest.in hosts.
  # Frontend build is split from backend (docker/frontend/Dockerfile for container deploys).
  - type: web
    name: Amynest-live-1
    runtime: static
    repo: https://github.com/ankur6779/Amynest-live
    branch: main
    autoDeployTrigger: commit
    buildCommand: bash scripts/render-frontend-build.sh
    staticPublishPath: ./artifacts/kidschedule/dist/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_AMYNEST_ENV
        value: production
      - key: VITE_APP_API_ORIGIN
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_VAPID_KEY
        sync: false
