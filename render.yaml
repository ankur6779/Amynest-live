# Render Blueprint — production + development stacks
# https://render.com/docs/blueprint-spec
#
# IMPORTANT:
# Service plan (RAM/CPU) must be managed via Render Dashboard.
# Do NOT define `plan` in render.yaml — Blueprint sync would overwrite
# manual upgrades (e.g. standard / 2GB) back to starter on every deploy.
#
# DO NOT DEFINE PLAN IN BLUEPRINT — leave plan undefined so the dashboard
# controls instance type for web, worker, and keyvalue services.
#
# IMPORTANT: Secrets and connection strings are NOT defined here with values.
# Set them only in the Render Dashboard. `sync: false` tells Blueprint to
# register the key once and NEVER overwrite dashboard values on deploy.
#
# Optional: disable Auto Deploy or avoid Blueprint re-sync in the Render
# Dashboard if you need to prevent any blueprint-driven drift.
#
# Production:
#   Amynest-backend     → https://amynest-backend.onrender.com
#   Amynest-live-1      → static web (amynest.in)
#
# Development / preview:
#   amynest-dev         → https://amynest-dev.onrender.com
#   amynest-frontend-dev → static preview web
#
# Health / env checks:
#   GET /api/healthz/env

databases:
  - name: amynest-db
    databaseName: amynest_db
    plan: basic-256mb
    region: singapore

  - name: amynest-db-dev
    databaseName: amynest_db_dev
    plan: basic-256mb
    region: singapore

services:
  # ─── Redis (BullMQ AI queue) ───────────────────────────────────────────────
  - type: keyvalue
    name: amynest-redis
    # DO NOT DEFINE PLAN IN BLUEPRINT — dashboard controls RAM/CPU
    region: singapore
    ipAllowList: []

  # ─── Production API ───────────────────────────────────────────────────────
  - type: web
    name: Amynest-backend
    runtime: node
    region: singapore
    # DO NOT DEFINE PLAN IN BLUEPRINT — dashboard controls RAM/CPU
    repo: https://github.com/ankur6779/Amynest-live
    branch: main
    buildCommand: >-
      corepack enable &&
      corepack prepare pnpm@9.15.0 --activate &&
      NODE_ENV=development pnpm install --frozen-lockfile &&
      pnpm --filter @workspace/api-server build &&
      pnpm --filter @workspace/db push
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: AMYNEST_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: REVENUECAT_SECRET_KEY
        sync: false
      - key: REVENUECAT_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: WORKER_ENABLED
        sync: false
      - key: BACKGROUND_TASKS_ENABLED
        sync: false
      - key: PHONICS_SEED_ENABLED
        sync: false
      - key: NOTIFICATIONS_ENABLED
        sync: false
      - key: EMAIL_FROM
        sync: false

  # ─── Production AI worker (BullMQ) ─────────────────────────────────────────
  - type: worker
    name: amynest-ai-worker
    runtime: node
    region: singapore
    # DO NOT DEFINE PLAN IN BLUEPRINT — dashboard controls RAM/CPU
    repo: https://github.com/ankur6779/Amynest-live
    branch: main
    buildCommand: bash scripts/render-ai-worker-build.sh
    startCommand: bash scripts/render-ai-worker-start.sh
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: AMYNEST_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: WORKER_ENABLED
        sync: false

  # ─── Development / staging API ────────────────────────────────────────────
  - type: web
    name: amynest-dev
    runtime: node
    region: singapore
    # DO NOT DEFINE PLAN IN BLUEPRINT — dashboard controls RAM/CPU
    repo: https://github.com/ankur6779/Amynest-live
    branch: main
    buildCommand: >-
      corepack enable &&
      corepack prepare pnpm@9.15.0 --activate &&
      NODE_ENV=development pnpm install --frozen-lockfile &&
      pnpm --filter @workspace/api-server build &&
      pnpm --filter @workspace/db push
    startCommand: AMYNEST_ENV=development pnpm --filter @workspace/api-server start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: development
      - key: AMYNEST_ENV
        value: development
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: API_PUBLIC_URL
        sync: false

  # ─── Production static web (amynest.in) ─────────────────────────────────────
  - type: web
    name: Amynest-live-1
    runtime: static
    repo: https://github.com/ankur6779/Amynest-live
    branch: main
    buildCommand: >-
      corepack enable &&
      corepack prepare pnpm@9.15.0 --activate &&
      pnpm install --frozen-lockfile &&
      BASE_PATH=/ PORT=3000 pnpm --filter @workspace/kidschedule build
    staticPublishPath: ./artifacts/kidschedule/dist/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_AMYNEST_ENV
        value: production
      - key: VITE_APP_API_ORIGIN
        value: https://amynest-backend.onrender.com
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_VAPID_KEY
        sync: false

  # ─── Development static web (preview) ─────────────────────────────────────
  - type: web
    name: amynest-frontend-dev
    runtime: static
    repo: https://github.com/ankur6779/Amynest-live
    branch: main
    buildCommand: >-
      corepack enable &&
      corepack prepare pnpm@9.15.0 --activate &&
      pnpm install --frozen-lockfile &&
      BASE_PATH=/ PORT=3000 pnpm --filter @workspace/kidschedule run build:dev
    staticPublishPath: ./artifacts/kidschedule/dist/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_AMYNEST_ENV
        value: development
      - key: VITE_APP_API_ORIGIN
        value: https://amynest-dev.onrender.com
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_VAPID_KEY
        sync: false
