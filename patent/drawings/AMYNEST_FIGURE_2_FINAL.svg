" fill="#000">code · temp · precip · wind</text><line x1="450" y1="286" x2="450" y2="308" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/><rect x="230" y="310" width="440" height="36" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="450.0" y="328" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000">5. Classify → outdoor-suitability set</text><line x1="450" y1="346" x2="450" y2="368" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/><rect x="200" y="370" width="500" height="40" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="450.0" y="388" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000">6. Re-read 211 — discard if user became authoritative</text><rect x="20" y="370" width="140" height="40" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="90.0" y="388" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000">discard derived</text><line x1="450" y1="410" x2="450" y2="432" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/><rect x="180" y="434" width="540" height="48" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="450.0" y="452" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000">7. Inject designated class into payload</text><text x="450.0" y="466" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000">independently of deferred UI commit</text><line x1="450" y1="482" x2="450" y2="500" stroke="#000" stroke-width="1.2" marker-end="url(#arr)"/><rect x="220" y="502" width="460" height="36" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="450.0" y="520" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000">8. Dispatch payload → generation (Fig. 3)</text>
