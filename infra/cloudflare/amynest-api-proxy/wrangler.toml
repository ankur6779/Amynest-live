# Cloudflare Worker — same-origin /api/* for amynest.in
# https://developers.cloudflare.com/workers/wrangler/
#
# One-time setup:
#   npm i -g wrangler
#   wrangler login
#   wrangler deploy
#
# Route (Cloudflare Dashboard → Workers → Triggers):
#   www.amynest.in/api/*
#   amynest.in/api/*   (optional apex)

name = "amynest-api-proxy"
main = "src/worker.js"
compatibility_date = "2024-06-01"

# Live production routes — wrangler deploy attaches these to the worker.
routes = [
  { pattern = "www.amynest.in/api/*", zone_name = "amynest.in" },
  { pattern = "amynest.in/api/*", zone_name = "amynest.in" },
  # Optional CDN hostname — add CNAME cdn.amynest.in → amynest.in (proxied) in Cloudflare DNS.
  # { pattern = "cdn.amynest.in/api/*", zone_name = "amynest.in" },
]

[vars]
BACKEND_ORIGIN = "https://amynest-backend-dykj.onrender.com"
# Canary — Render stays primary until CANARY_PERCENT reaches 100.
# Deploy with CANARY_PERCENT=0 for no canary traffic (safe default).
CANARY_BACKEND_ORIGIN = "https://ik6ml2uhw6op765lo14wn5m3.188.245.208.126.sslip.io"
CANARY_PERCENT = "0"
GCS_BUCKET = "amynest-audio-storage"
REELS_CATALOG_GCS_PATH = "reels-hub/phase1/catalog.v1.json"
# Set to "1" after Phase 2B certification. Rollback: set to "0" and redeploy Worker.
REELS_GCS_ORIGIN = "1"
workers_dev = false
preview_urls = false

# Required secret (wrangler secret put GCS_SERVICE_ACCOUNT_JSON):
#   Full Google service account JSON with storage.objects.get on amynest-audio-storage
