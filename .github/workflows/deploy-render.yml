# DEPRECATED entry point — use "Production deploy (gated)" on main pushes.
# Triggers Render API hot standby only (static is Cloudflare Pages).
# Kept for manual emergency deploy only (bypasses CI gates — use with care).

name: Deploy Render (production)

on:
  workflow_dispatch:

concurrency:
  group: deploy-render-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Render deploys (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'ankur6779/Amynest-live'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger production deploys
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "RENDER_API_KEY not configured."
            exit 1
          fi
          bash scripts/trigger-render-deploy.sh "${{ github.sha }}"
