# Amy Astro public launch ops:
# 1) Apply additive migration 0050 via Coolify API ops endpoint
# 2) Confirm Coolify public GA via /api/health.birthSkyPublicEnabled
# 3) Confirm Cloudflare Pages leaves VITE_FF_BIRTH_SKY unset
#
# Never runs unscoped drizzle-kit push against Coolify.

name: Birth Sky public launch ops

on:
  push:
    branches: [main]
    paths:
      - "lib/db/migrations/0050_birth_sky_sounds_default_on.sql"
      - "scripts/birth-sky-apply-0050-migration.mjs"
      - "scripts/birth-sky-verify-0050-migration.mjs"
      - ".github/workflows/birth-sky-public-launch-ops.yml"
      - "artifacts/api-server/src/routes/health.ts"
      - "artifacts/api-server/src/services/birth-sky/allowlist.ts"
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type launch-ops to apply 0050 + probe kill switches"
        required: true
        type: string

jobs:
  migrate-0050-via-api:
    name: Apply + verify migration 0050 (via Coolify API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event_name == 'push' ||
      github.event.inputs.confirm == 'launch-ops'
    steps:
      - name: Wait for Coolify redeploy then apply 0050
        env:
          INTERNAL_HEALTH_SECRET: ${{ secrets.INTERNAL_HEALTH_SECRET }}
          API_URL: https://ik6ml2uhw6op765lo14wn5m3.188.245.208.126.sslip.io
        run: |
          set -euo pipefail
          if [ -z "${INTERNAL_HEALTH_SECRET:-}" ]; then
            echo "INTERNAL_HEALTH_SECRET not configured."
            exit 1
          fi
          # Wait until the ops route exists (Coolify redeploy after this push).
          for i in $(seq 1 36); do
            CODE="$(curl -sS -A 'AmyNest-LaunchOps/1.0' -o /tmp/mig.json -w '%{http_code}' --max-time 30 \
              -X POST -H "x-health-secret: ${INTERNAL_HEALTH_SECRET}" \
              "${API_URL}/api/healthz/ops/birth-sky-mig-0050" || echo 000)"
            echo "attempt $i http=$CODE body=$(head -c 200 /tmp/mig.json 2>/dev/null || true)"
            if [ "$CODE" = "200" ]; then
              node -e '
              const j=JSON.parse(require("fs").readFileSync("/tmp/mig.json","utf8"));
              if (j.ok===true && String(j.sky_sounds_default||"").toLowerCase().includes("true")) {
                console.log("VERIFY_OK", JSON.stringify(j));
                process.exit(0);
              }
              console.error("VERIFY_FAIL", j);
              process.exit(1);
              '
              exit $?
            fi
            # 404 = route not deployed yet or bad secret; keep waiting for redeploy.
            sleep 15
          done
          echo "FAIL: migration endpoint never succeeded"
          exit 1

  coolify-kill-switch-probe:
    name: Coolify BIRTH_SKY_PUBLIC_ENABLED probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event_name == 'push' ||
      github.event.inputs.confirm == 'launch-ops'
    steps:
      - name: Probe /api/health.birthSkyPublicEnabled
        env:
          API_URL: https://ik6ml2uhw6op765lo14wn5m3.188.245.208.126.sslip.io
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            CODE="$(curl -sS -A 'AmyNest-LaunchOps/1.0' -o /tmp/bs-health.json -w '%{http_code}' --max-time 25 \
              "${API_URL}/api/health" || echo 000)"
            if [ "$CODE" = "200" ]; then
              set +e
              node -e '
              const j=JSON.parse(require("fs").readFileSync("/tmp/bs-health.json","utf8"));
              console.log(JSON.stringify(j));
              if (j.birthSkyPublicEnabled === true) {
                console.log("KILL_SWITCH_OK=runtime_public_on (/api/health)");
                process.exit(0);
              }
              process.exit(2);
              '
              RC=$?
              set -e
              if [ "$RC" -eq 0 ]; then exit 0; fi
            fi
            echo "attempt $i http=$CODE — waiting…"
            sleep 10
          done
          echo "FAIL: birthSkyPublicEnabled is not true"
          head -c 400 /tmp/bs-health.json || true
          exit 1

  cloudflare-flag-probe:
    name: Cloudflare Pages VITE_FF_BIRTH_SKY probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event_name == 'push' ||
      github.event.inputs.confirm == 'launch-ops'
    steps:
      - uses: actions/checkout@v4

      - name: Assert deploy-cloudflare-pages.sh leaves flag unset
        run: |
          set -euo pipefail
          if grep -nE '^\s*(export\s+)?VITE_FF_BIRTH_SKY=' scripts/deploy-cloudflare-pages.sh; then
            echo "FAIL: deploy script assigns VITE_FF_BIRTH_SKY"
            exit 1
          fi
          if ! grep -n 'unset VITE_FF_BIRTH_SKY' scripts/deploy-cloudflare-pages.sh; then
            echo "FAIL: deploy script should explicitly unset VITE_FF_BIRTH_SKY"
            exit 1
          fi
          echo "OK: deploy script unsets VITE_FF_BIRTH_SKY (public default ON)"

      - name: Probe live Pages bundle for explicit kill
        run: |
          set -euo pipefail
          HTML="$(curl -sS -A 'AmyNest-LaunchOps/1.0' --max-time 30 'https://amynest-web.pages.dev/')"
          ASSETS="$(printf '%s' "$HTML" | grep -oE '/assets/[^" ]+\.js' | head -8 || true)"
          if [ -z "$ASSETS" ]; then
            echo "WARN: no /assets/*.js found — skip live bundle probe"
            exit 0
          fi
          HIT=0
          for a in $ASSETS; do
            BODY="$(curl -sS -A 'AmyNest-LaunchOps/1.0' --max-time 30 "https://amynest-web.pages.dev${a}" || true)"
            if printf '%s' "$BODY" | grep -Eq 'VITE_FF_BIRTH_SKY["'"'"']?\s*[:=]\s*["'"'"']?0|FF_BIRTH_SKY\s*=\s*!1|FF_BIRTH_SKY\s*=\s*false'; then
              echo "FAIL: kill pattern in $a"
              HIT=1
            fi
          done
          if [ "$HIT" -ne 0 ]; then
            exit 1
          fi
          echo "OK: no explicit VITE_FF_BIRTH_SKY kill pattern in sampled Pages assets"
