# Ping production API every 5 minutes so Render free/starter tier stays awake
# and audio/TTS endpoints respond without cold-start delays.

name: Keep backend warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Health + audio stack
        run: |
          set -e
          curl -sfS --max-time 30 "https://amynest-backend-dykj.onrender.com/health"
          curl -sfS --max-time 30 "https://amynest-backend-dykj.onrender.com/api/healthz/audio"
          echo "Backend warm ping OK"
