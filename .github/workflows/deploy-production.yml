# Production deploy — runs all CI gates first; then Pages (static) + Hetzner worker.
#
# Live static: Cloudflare Pages (amynest-web) → www.amynest.in
# Live API: Coolify (auto-deploy via Coolify Git webhook — not this workflow)
# AI worker: Hetzner (path-filtered SSH deploy)
# Render API standby is retired (service suspended) — do not trigger from CI.

name: Production deploy (gated)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production-main
  cancel-in-progress: false

jobs:
  crash-release-gates:
    uses: ./.github/workflows/crash-release-gates.yml
    secrets: inherit

  routine-engine-gates:
    uses: ./.github/workflows/routine-engine-gates.yml
    secrets: inherit

  audio-gates:
    uses: ./.github/workflows/audio-gates.yml
    secrets: inherit

  chat-platform-gates:
    uses: ./.github/workflows/chat-platform.yml
    secrets: inherit

  typecheck-gate:
    name: TypeScript gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (libs + artifacts + scripts)
        run: pnpm run typecheck

  deploy-pages:
    name: Deploy static SPA (Cloudflare Pages)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [crash-release-gates, routine-engine-gates, audio-gates, chat-platform-gates, typecheck-gate]
    if: |
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      github.repository == 'ankur6779/Amynest-live'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          VITE_APP_API_ORIGIN: https://www.amynest.in
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_GA4_MEASUREMENT_ID: ${{ secrets.VITE_GA4_MEASUREMENT_ID }}
        run: bash scripts/deploy-cloudflare-pages.sh

      - name: Post-deploy smoke (production)
        run: bash scripts/post-deploy-smoke.sh
        env:
          SMOKE_BASE_URL: https://www.amynest.in
          SMOKE_API_URL: https://www.amynest.in

  deploy-hetzner-worker:
    name: Deploy Hetzner AI worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [crash-release-gates, routine-engine-gates, audio-gates, chat-platform-gates, typecheck-gate]
    if: |
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      github.repository == 'ankur6779/Amynest-live'
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            worker:
              - 'artifacts/api-server/**'
              - 'docker/worker/**'
              - 'lib/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'scripts/hetzner/**'
              - '.github/workflows/deploy-production.yml'

      - name: Skip — no worker-related changes
        if: steps.changes.outputs.worker != 'true'
        run: echo "No worker paths changed; skipping Hetzner deploy."

      - name: Setup SSH
        if: steps.changes.outputs.worker == 'true'
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          if [ -z "$HETZNER_SSH_KEY" ] || [ -z "$HETZNER_HOST" ]; then
            echo "HETZNER_SSH_PRIVATE_KEY or HETZNER_HOST not configured."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/hetzner_deploy
          chmod 600 ~/.ssh/hetzner_deploy
          host="$(printf '%s' "$HETZNER_HOST" | tr -d '[:space:]')"
          ssh-keyscan -H "$host" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/hetzner_deploy -o BatchMode=yes -o ConnectTimeout=15 "root@${host}" echo "SSH preflight OK"

      - name: Deploy via SSH
        if: steps.changes.outputs.worker == 'true'
        env:
          HETZNER_SSH_KEY_FILE: /home/runner/.ssh/hetzner_deploy
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
        run: bash scripts/hetzner/deploy-worker-remote.sh
