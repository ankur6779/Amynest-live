name: ChatPlatform gates

on:
  pull_request:
    paths:
      - "artifacts/kidschedule/**"
      - "scripts/check-chat-platform*.ts"
      - "android/**"
  workflow_dispatch:
  workflow_call:

jobs:
  chat-platform:
    name: ChatPlatform enforcement + visibility tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Static ChatPlatform ownership gate
        run: pnpm run check:chat-platform

  device-certification:
    name: ChatPlatform device certification (manual release gate)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Device certification gate
        run: pnpm run check:chat-platform-certification
