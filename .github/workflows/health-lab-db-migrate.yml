name: Health Lab DB migrate

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type migrate to apply health_lab_progress schema"
        required: true
        type: string

jobs:
  migrate:
    name: Apply health_lab_progress schema
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'migrate'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Drizzle push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:push

      - name: Verify table and indexes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @workspace/db exec node --input-type=module -e "
          import pg from 'pg';
          const pool = new pg.Pool({
            connectionString: process.env.DATABASE_URL,
            ssl: process.env.DATABASE_URL.includes('render.com') ? { rejectUnauthorized: false } : undefined,
          });
          const t = await pool.query(\"SELECT to_regclass('public.health_lab_progress') IS NOT NULL AS exists\");
          if (!t.rows[0]?.exists) { console.error('health_lab_progress missing'); process.exit(1); }
          const idx = await pool.query(\"SELECT indexname FROM pg_indexes WHERE tablename = 'health_lab_progress'\");
          const names = idx.rows.map((r) => r.indexname);
          console.log('indexes:', names.join(', '));
          if (!names.includes('health_lab_progress_child_uq')) { console.error('child_uq index missing'); process.exit(1); }
          const dup = await pool.query('SELECT child_id, COUNT(*) AS n FROM health_lab_progress GROUP BY child_id HAVING COUNT(*) > 1');
          if (dup.rowCount > 0) { console.error('duplicate child rows'); process.exit(1); }
          console.log('health_lab_progress migration verified OK');
          await pool.end();
          "
