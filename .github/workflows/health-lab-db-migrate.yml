name: Health Lab DB migrate

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type migrate to apply health_lab_progress schema"
        required: true
        type: string

jobs:
  migrate:
    name: Apply health_lab_progress schema
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'migrate'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Drizzle push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:push

      - name: Verify table and indexes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @workspace/db exec node ../../scripts/health-lab-verify-migration.mjs
