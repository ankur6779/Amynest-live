# Pre-generate all static TTS MP3s (core catalog + extended corpus) and commit static-audio-map.json.
# Requires secrets: OPENAI_API_KEY, DEFAULT_OBJECT_STORAGE_BUCKET_ID, GCS_SERVICE_ACCOUNT_JSON
name: Generate static audio

on:
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: "Regenerate ALL MP3s (use after changing voice e.g. alloy → coral). Takes ~30–90 min."
        required: false
        default: false
        type: boolean
      audio_lessons_only:
        description: "Regenerate only Amy Audio Lesson paragraphs + titles (~264 phrases)."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Generate and upload static audio (full corpus, retries until 100%)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_INTEGRATIONS_OPENAI_API_KEY: ${{ secrets.AI_INTEGRATIONS_OPENAI_API_KEY }}
          DEFAULT_OBJECT_STORAGE_BUCKET_ID: ${{ secrets.DEFAULT_OBJECT_STORAGE_BUCKET_ID }}
          GCS_SERVICE_ACCOUNT_JSON: ${{ secrets.GCS_SERVICE_ACCOUNT_JSON }}
          API_PUBLIC_URL: ${{ secrets.API_PUBLIC_URL }}
          STATIC_AUDIO_VOICE: coral
          OPENAI_TTS_VOICE: coral
          STATIC_AUDIO_MAX_RETRIES: "5"
          STATIC_AUDIO_TTS_TIMEOUT_MS: "30000"
          STATIC_AUDIO_INTER_REQUEST_MS: "350"
        run: |
          pnpm run scan:speakable-phrases
          if [ "${{ inputs.force_regenerate }}" = "true" ]; then
            echo "Force regenerate: all phrases with female voice (coral)"
            pnpm run generate:static-audio -- --force-all
          elif [ "${{ inputs.audio_lessons_only }}" = "true" ]; then
            echo "Regenerate Amy Audio Lesson corpus only"
            pnpm run generate:static-audio -- --audio-lessons-only
          else
            pnpm run generate:static-audio
          fi

      - name: Verify 100% coverage
        env:
          STATIC_AUDIO_REQUIRE_FULL_CORPUS: "1"
        run: pnpm run check:static-audio

      - name: Commit map updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacts/kidschedule/src/data/static-audio-map.json \
            artifacts/api-server/src/data/static-audio-map.json \
            artifacts/kidschedule/src/data/speakable-phrase-corpus.json
          if git diff --staged --quiet; then
            echo "No map changes to commit"
            exit 0
          fi
          git commit -m "auto generated static audio"
          # main may advance while generation runs (e.g. deploy fixes) — rebase before push
          git pull --rebase origin main
          git push origin main
