# Deploy Hetzner AI worker on main when worker-related code changes.
#
# Secrets (GitHub → Settings → Secrets → Actions):
#   HETZNER_SSH_PRIVATE_KEY — deploy key (no passphrase), public key on server
#   HETZNER_HOST            — e.g. 167.233.39.146
#
# Env vars stay on the server at /opt/amynest/worker.env (initial manual deploy).
# Re-run scripts/hetzner/deploy-worker.sh locally when secrets change.

name: Deploy Hetzner AI worker

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/api-server/**'
      - 'docker/worker/**'
      - 'lib/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'scripts/hetzner/**'
      - '.github/workflows/deploy-hetzner-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-hetzner-worker-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Hetzner worker
    runs-on: ubuntu-latest
    if: github.repository == 'ankur6779/Amynest-live'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          if [ -z "$HETZNER_SSH_KEY" ] || [ -z "$HETZNER_HOST" ]; then
            echo "HETZNER_SSH_PRIVATE_KEY or HETZNER_HOST not configured."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/hetzner_deploy
          chmod 600 ~/.ssh/hetzner_deploy
          host="$(printf '%s' "$HETZNER_HOST" | tr -d '[:space:]')"
          ssh-keyscan -H "$host" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/hetzner_deploy -o BatchMode=yes -o ConnectTimeout=15 "root@${host}" echo "SSH preflight OK"

      - name: Deploy via SSH
        env:
          HETZNER_SSH_KEY_FILE: /home/runner/.ssh/hetzner_deploy
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
        run: bash scripts/hetzner/deploy-worker-remote.sh
